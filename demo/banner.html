<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Rendered at 1280×640 into art/banner.png by demo/screenshots.sh. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Literata:opsz,wght@7..72,400&family=Schibsted+Grotesk:wght@500;700;800&display=swap">
    <style>
        html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #fff; color: #1a1d24; color-scheme: light; }
        body { position: relative; font-family: "Schibsted Grotesk", sans-serif; }
        .copy { position: absolute; left: 72px; top: 64px; width: 560px; }
        .mark { font: 700 26px/1 "Schibsted Grotesk"; letter-spacing: -.01em; }
        .mark span { color: #2251d1; font-weight: 500; }
        h1 { font: 800 64px/1.02 "Schibsted Grotesk"; letter-spacing: -.035em; margin: 64px 0 24px; }
        p { font: 400 22px/1.5 "Literata", serif; color: #5d6574; margin: 0 0 36px; }
        code { display: inline-block; font: 500 19px/1 "JetBrains Mono", monospace; background: #f5f7fb; border: 1px solid #e3e7ee; border-radius: 10px; padding: 16px 20px; }
        code::before { content: "$ "; color: #5d6574; }
        .by { position: absolute; left: 72px; bottom: 56px; font: 500 18px/1 "Schibsted Grotesk"; color: #5d6574; }
        .by strong { color: #1a1d24; }
        .shot { position: absolute; left: 680px; top: 72px; width: 900px; border: 1px solid #e3e7ee; border-radius: 16px; box-shadow: 0 30px 60px -30px rgb(34 81 209 / .45); }
    </style>
</head>
<body>
    <div class="copy">
        <div class="mark"><span>[[</span> Laravel Wiki <span>]]</span></div>
        <h1>The wiki that lives inside your Laravel app.</h1>
        <p>Markdown pages, links between them, and the full history of every change.</p>
        <code>composer require ruvelo/laravel-wiki</code>
    </div>
    <div class="by">Free and open source, by <strong>Ruvelo</strong></div>
    <img class="shot" src="laravel-wiki/art/screenshot-editor.png" alt="">
</body>
</html>
